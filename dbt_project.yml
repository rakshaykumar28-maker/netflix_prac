# Name your project
name: 'netflix_prac'
version: '1.0.0'
config-version: 2

# Profile
profile: 'default'

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  netflix_prac:
    staging:
      +materialized: view
    marts:
      +materialized: table
